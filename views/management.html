<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Local Connection Settings</title><link rel="stylesheet" href="/ri3d26/main.css"></head><body class="designed-background"><div class="center-module"><section class="container across-screen"><a href="/ri3d26/home" class="bg-secondary" style="display:inline-block;padding:10px 20px;border-radius:8px;text-decoration:none;margin-bottom:16px">Back to Home</a><h2>Local Connection Settings</h2><p>These settings stay on this computer. Keep this page open only on the OBS PC.</p><form id="settings"><p><label>OBS WebSocket URL<br><input id="obs" required style="width:100%"></label></p><p><label>OBS password<br><input id="password" type="password" autocomplete="new-password" style="width:100%" placeholder="Leave blank to keep saved password"></label></p><p id="saved"></p><p><label>Controller URL (local or CCR)<br><input id="controller" required style="width:100%"></label></p><button class="bg-primary" type="submit">Save &amp; Connect</button> <button type="button" id="disconnect" class="bg-secondary">Disconnect OBS</button></form><p id="status" role="status"></p></section></div><script>
const el=id=>document.getElementById(id);let disabled=false;
fetch('/management/settings').then(r=>r.json()).then(c=>{el('obs').value=c.obsUrl;el('controller').value=c.controllerUrl;el('saved').textContent=c.hasPassword?'A password is saved.':'No password saved.';disabled=c.disabled;}).catch(()=>el('status').textContent='Cannot load settings.');
async function save(stop){try{const r=await fetch('/management/settings',{method:'POST',headers:{'Content-Type':'application/json','X-Local-Settings':'1'},body:JSON.stringify({obsUrl:el('obs').value,controllerUrl:el('controller').value,password:el('password').value,disabled:stop})});if(!r.ok)throw Error('Check the connection addresses.');el('password').value='';el('status').textContent=stop?'Saved. Bridge will disconnect OBS.':'Saved. Running bridge will reconnect within a few seconds.';}catch(e){el('status').textContent=e.message;}}
el('settings').onsubmit=e=>{e.preventDefault();save(false)};el('disconnect').onclick=()=>save(true);
</script></body></html>
