<!doctype html><html><head><meta charset="utf-8"><style>html,body,video{margin:0;width:100%;height:100%;background:#000}video{object-fit:contain}#status{position:absolute;bottom:10px;color:white;font:14px sans-serif}</style><script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script></head><body><video id="video" autoplay playsinline></video><div id="status"></div><script>
const url=new URLSearchParams(location.search).get('url'),video=document.getElementById('video'),status=document.getElementById('status');
if(!url||!/^https?:\/\//.test(url)){status.textContent='Invalid feed URL';}else if(window.Hls&&Hls.isSupported()){const hls=new Hls();hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{video.muted=true;video.play().catch(()=>{})}));hls.on(Hls.Events.ERROR,(_,data)=>{if(data.fatal){status.textContent='Feed reconnecting…';setTimeout(()=>{if(data.type===Hls.ErrorTypes.MEDIA_ERROR)hls.recoverMediaError();else hls.startLoad()},3000)}});video.onplaying=()=>status.textContent='';}else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;video.play().catch(()=>{});}else status.textContent='Video player failed to load';
</script></body></html>
